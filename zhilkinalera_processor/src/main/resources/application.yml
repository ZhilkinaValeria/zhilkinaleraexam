spring:
  application:
    name: zhilkinalera_processor

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  datasource:
    jdbc-url: jdbc:postgresql://localhost:5432/passport_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# clickhouse:
#   url: jdbc:clickhouse://exam:@localhost:8123/default?protocol=http&compress=0&ssl=false&connection_timeout=10000&socket_timeout=30000

clickhouse:
  url: jdbc:clickhouse://default:@localhost:8123/default

server:
  port: 8081

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html